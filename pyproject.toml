[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "entice-inventory"
version = "0.1.0"
description = "Data preparation and GTAP database disaggregation workflows for ENTICE with MARIO/CVXLab"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
]

[project.optional-dependencies]
export = ["pandas", "pyarrow"]
# Needed only for the QA plotting module (entice_inventory.export.plot_d24_split).
plots = ["pandas", "numpy", "matplotlib"]
reconcile = ["pandas>=2.3.3", "numpy", "pyarrow", "scipy", "cvxpy"]
benchmark = ["pandas", "numpy", "pyarrow", "scipy"]

# Note: the database steps in scripts/run_d24_pipeline.py also require `mario`,
# which is installed separately (local/Git checkout), not from PyPI.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"entice_inventory.core" = ["benchmark_dashboard.html"]

[tool.setuptools.data-files]
"share/entice-inventory/registry" = [
    "data/registry/sectors.json",
    "data/registry/regions.json",
    "data/registry/gtap12.json",
]
"share/entice-inventory/config" = ["config/cleaning-policy.json"]
